name: mobile
description: "GastroVoyage — Culinary Passport"
publish_to: 'none'
version: 2.1.0+2

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  dio: ^5.7.0
  google_fonts: ^6.1.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  lucide_icons: ^0.257.0
  flutter_animate: ^4.5.0
  page_flip: ^0.2.5+1
  url_launcher: ^6.3.1
  flutter_svg: ^2.0.10+1
  webview_flutter: ^4.10.0
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.3
  pdf: ^3.11.1
  printing: ^5.13.1
  share_plus: ^10.1.2
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/maps/countries/
    - assets/components/girls/
    - assets/components/couples/
    - assets/components/guys/
